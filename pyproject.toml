[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-orchestrator"
version = "0.1.0"
description = "A bounded, auditable local dispatcher for REA specialist workers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Derek Winer" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
rea-orchestrator = "rea_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
